<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e" />
      <stop offset="100%" style="stop-color:#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444" />
      <stop offset="30%" style="stop-color:#f59e0b" />
      <stop offset="60%" style="stop-color:#eab308" />
      <stop offset="100%" style="stop-color:#22c55e" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#chartBg)" rx="8" />

  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">
    Radiation Decay Over Time
  </text>
  <text x="200" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">
    The "7-10 Rule": Every 7x time increase = 10x radiation decrease
  </text>

  <!-- Chart area -->
  <g transform="translate(50, 55)">
    <!-- Grid lines -->
    <g stroke="#334155" stroke-width="1" stroke-dasharray="2,4">
      <line x1="0" y1="0" x2="320" y2="0" />
      <line x1="0" y1="40" x2="320" y2="40" />
      <line x1="0" y1="80" x2="320" y2="80" />
      <line x1="0" y1="120" x2="320" y2="120" />
      <line x1="0" y1="160" x2="320" y2="160" />
    </g>

    <!-- Y-axis labels -->
    <text x="-10" y="5" text-anchor="end" fill="#94a3b8" font-size="9">100%</text>
    <text x="-10" y="45" text-anchor="end" fill="#94a3b8" font-size="9">75%</text>
    <text x="-10" y="85" text-anchor="end" fill="#94a3b8" font-size="9">50%</text>
    <text x="-10" y="125" text-anchor="end" fill="#94a3b8" font-size="9">25%</text>
    <text x="-10" y="165" text-anchor="end" fill="#94a3b8" font-size="9">0%</text>

    <!-- X-axis labels -->
    <text x="0" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">1hr</text>
    <text x="80" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">7hr</text>
    <text x="160" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">24hr</text>
    <text x="240" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">2 days</text>
    <text x="320" y="180" text-anchor="middle" fill="#94a3b8" font-size="9">2 weeks</text>

    <!-- Decay curve -->
    <path d="M0,0 Q40,120 80,144 Q120,152 160,156 Q200,158 240,159 L320,160" fill="none" stroke="url(#lineGrad)"
      stroke-width="3" filter="url(#glow)" />

    <!-- Data points -->
    <g filter="url(#glow)">
      <circle cx="0" cy="0" r="6" fill="#ef4444" />
      <circle cx="80" cy="144" r="6" fill="#f59e0b" />
      <circle cx="160" cy="156" r="6" fill="#eab308" />
      <circle cx="240" cy="158" r="6" fill="#84cc16" />
      <circle cx="320" cy="159" r="6" fill="#22c55e" />
    </g>

    <!-- Point labels -->
    <text x="0" y="-12" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="bold">100%</text>
    <text x="80" y="135" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">~10%</text>
    <text x="160" y="147" text-anchor="middle" fill="#eab308" font-size="10" font-weight="bold">~2%</text>
    <text x="240" y="149" text-anchor="middle" fill="#84cc16" font-size="10" font-weight="bold">~1%</text>
    <text x="320" y="150" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">~0.1%</text>

    <!-- Danger zone indicator -->
    <rect x="0" y="-5" width="80" height="165" fill="#ef4444" fill-opacity="0.1" />
    <text x="40" y="95" text-anchor="middle" fill="#ef4444" font-size="8" font-weight="bold"
      transform="rotate(-90, 40, 95)">
      MOST DANGEROUS
    </text>
  </g>

  <!-- Key insight -->
  <rect x="20" y="215" width="360" height="25" fill="#065f46" fill-opacity="0.3" stroke="#10b981" rx="4" />
  <text x="200" y="232" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">
    STAY SHELTERED FOR AT LEAST 24 HOURS
  </text>
</svg>