<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#4ade80"/>
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#60a5fa"/>
    </linearGradient>
    <linearGradient id="barGrad6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="8"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="bold">
    Shelter Protection Factors
  </text>
  <text x="200" y="40" text-anchor="middle" fill="#94a3b8" font-size="10">
    Higher = More radiation blocked
  </text>
  
  <!-- Chart -->
  <g transform="translate(20, 55)">
    <!-- Open Air -->
    <g transform="translate(0, 0)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Open Air</text>
      <rect x="115" y="5" width="3" height="18" fill="url(#barGrad1)" rx="2"/>
      <text x="125" y="18" fill="#ef4444" font-size="10" font-weight="bold">1x</text>
      <text x="175" y="18" fill="#6b7280" font-size="9">(no protection)</text>
    </g>
    
    <!-- Wood House -->
    <g transform="translate(0, 35)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Wood House</text>
      <rect x="115" y="5" width="6" height="18" fill="url(#barGrad2)" rx="2"/>
      <text x="128" y="18" fill="#f59e0b" font-size="10" font-weight="bold">2x</text>
    </g>
    
    <!-- Brick House -->
    <g transform="translate(0, 70)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Brick House</text>
      <rect x="115" y="5" width="30" height="18" fill="url(#barGrad3)" rx="2"/>
      <text x="152" y="18" fill="#eab308" font-size="10" font-weight="bold">10x</text>
    </g>
    
    <!-- Concrete Building -->
    <g transform="translate(0, 105)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Concrete Building</text>
      <rect x="115" y="5" width="120" height="18" fill="url(#barGrad4)" rx="2"/>
      <text x="242" y="18" fill="#22c55e" font-size="10" font-weight="bold">40x</text>
    </g>
    
    <!-- Basement -->
    <g transform="translate(0, 140)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Basement (3ft earth)</text>
      <rect x="115" y="5" width="200" height="18" fill="url(#barGrad5)" rx="2"/>
      <text x="322" y="18" fill="#3b82f6" font-size="10" font-weight="bold">200x</text>
    </g>
    
    <!-- Underground Shelter -->
    <g transform="translate(0, 175)">
      <text x="110" y="15" text-anchor="end" fill="#94a3b8" font-size="10">Underground Shelter</text>
      <rect x="115" y="5" width="240" height="18" fill="url(#barGrad6)" rx="2"/>
      <text x="360" y="18" fill="#8b5cf6" font-size="10" font-weight="bold">1000x</text>
    </g>
  </g>
  
  <!-- Visual key -->
  <g transform="translate(20, 250)">
    <rect x="0" y="0" width="360" height="40" fill="#1e293b" stroke="#334155" rx="5"/>
    <text x="180" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">
      KEY INSIGHT
    </text>
    <text x="180" y="32" text-anchor="middle" fill="#94a3b8" font-size="10">
      More mass between you and fallout = better protection
    </text>
  </g>
  
  <!-- Shield icon decoration -->
  <g transform="translate(355, 55)" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.5">
    <path d="M12 2 L22 7 L22 13 C22 18 17 22 12 24 C7 22 2 18 2 13 L2 7 L12 2Z"/>
    <path d="M12 8 L12 14 M12 17 L12 17.5"/>
  </g>
</svg>
