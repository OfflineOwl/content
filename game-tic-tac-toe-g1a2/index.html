<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #a0aec0; font-size: 0.85rem; margin-bottom: 1rem; }
        .status {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1rem 0;
            min-height: 2rem;
            color: #4ade80;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
            background: #16213e;
            padding: 12px;
            border-radius: 12px;
        }
        .cell {
            width: 90px;
            height: 90px;
            background: #0f3460;
            border: none;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .cell:hover:not(.taken) { background: #1a4a7a; }
        .cell.x { color: #e94560; }
        .cell.o { color: #4ade80; }
        .cell.win { background: rgba(74, 222, 128, 0.3); }
        .scores {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            padding: 1rem;
            background: #16213e;
            border-radius: 8px;
        }
        .score { text-align: center; }
        .score-value { font-size: 1.5rem; font-weight: bold; }
        .score-label { font-size: 0.75rem; color: #a0aec0; }
        .score-x .score-value { color: #e94560; }
        .score-o .score-value { color: #4ade80; }
        .controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #16213e; }
        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .mode-btn {
            padding: 0.5rem 1rem;
            background: #16213e;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .mode-btn.active { border-color: #e94560; background: rgba(233, 69, 96, 0.2); }
    </style>
<style id="owl-theme-bridge">
:root[data-theme="dark"] {
  --bg-primary: #0e1524;
  --bg-secondary: #162036;
  --bg-card: #1d2943;
  --accent: #f0a030;
  --text-primary: #ece8dc;
  --text-secondary: #9ba6bd;
  --border: #24304a;
  color-scheme: dark;
}
:root[data-theme="dark"] body {
  background: #0e1524 !important;
  color: #ece8dc !important;
}
:root[data-theme="dark"] h1,
:root[data-theme="dark"] .title,
:root[data-theme="dark"] .stat-value {
  color: #f0a030 !important;
}
:root[data-theme="dark"] .stat,
:root[data-theme="dark"] .score-box,
:root[data-theme="dark"] .panel,
:root[data-theme="dark"] .ctrl-btn {
  background: #162036 !important;
  border: 1.5px solid #24304a !important;
  color: #ece8dc !important;
}
:root[data-theme="dark"] .board,
:root[data-theme="dark"] .grid,
:root[data-theme="dark"] .game-board {
  background: #162036 !important;
  border-color: #24304a !important;
}
:root[data-theme="dark"] .cell:not([class*="cell-"]):not(.red):not(.yellow):not(.p1):not(.p2):not(.revealed):not(.mine):not(.flagged):not(.correct):not(.present):not(.absent):not(.selected):not(.highlighted):not(.fixed):not(.given):not(.conflict):not(.error):not(.x):not(.o) {
  background: #1d2943;
  color: #ece8dc;
}
:root[data-theme="dark"] .btn:not(.btn-secondary):not(.btn-red):not(.btn-blue):not(.btn-green):not(.btn-yellow) {
  background: #f0a030 !important;
  color: #0e1524 !important;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e6;
  --bg-secondary: #fafbf6;
  --bg-card: #e3e6d8;
  --accent: #4b5a25;
  --text-primary: #1e2420;
  --text-secondary: #5b635c;
  --border: #c9ccbd;
  color-scheme: light;
}
:root[data-theme="light"] body {
  background: #eef0e6 !important;
  color: #1e2420 !important;
}
:root[data-theme="light"] h1,
:root[data-theme="light"] .title,
:root[data-theme="light"] .stat-value {
  color: #4b5a25 !important;
}
:root[data-theme="light"] .subtitle,
:root[data-theme="light"] .stat-label,
:root[data-theme="light"] .instructions,
:root[data-theme="light"] .hint,
:root[data-theme="light"] .info,
:root[data-theme="light"] .label {
  color: #5b635c !important;
}
:root[data-theme="light"] .stat,
:root[data-theme="light"] .score-box,
:root[data-theme="light"] .panel,
:root[data-theme="light"] .card-panel,
:root[data-theme="light"] .info-box,
:root[data-theme="light"] .modal-content,
:root[data-theme="light"] .game-over,
:root[data-theme="light"] .overlay-content,
:root[data-theme="light"] .difficulty-btn,
:root[data-theme="light"] .mode-btn,
:root[data-theme="light"] .ctrl-btn,
:root[data-theme="light"] .key,
:root[data-theme="light"] .letter-btn,
:root[data-theme="light"] .num-btn,
:root[data-theme="light"] .choice-btn,
:root[data-theme="light"] .option-btn {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border: 1.5px solid #c9ccbd !important;
}
:root[data-theme="light"] .board,
:root[data-theme="light"] .grid,
:root[data-theme="light"] .game-board {
  background: #e3e6d8 !important;
  border: 1.5px solid #c9ccbd !important;
}
:root[data-theme="light"] .cell:not([class*="cell-"]):not(.red):not(.yellow):not(.p1):not(.p2):not(.revealed):not(.mine):not(.flagged):not(.correct):not(.present):not(.absent):not(.selected):not(.highlighted):not(.fixed):not(.given):not(.conflict):not(.error):not(.x):not(.o) {
  background: #d4d8c8;
  color: #1e2420;
  border-color: #b8bca9;
}
:root[data-theme="light"] .btn:not(.btn-secondary):not(.btn-red):not(.btn-blue):not(.btn-green):not(.btn-yellow) {
  background: #4b5a25 !important;
  color: #fafbf6 !important;
}
:root[data-theme="light"] .btn-secondary {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border: 1.5px solid #1e2420 !important;
}
:root[data-theme="light"] input[type="text"],
:root[data-theme="light"] input[type="number"],
:root[data-theme="light"] textarea,
:root[data-theme="light"] select {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border-color: #1e2420 !important;
}
:root.owl-embedded body,
:root.owl-embedded .container,
:root.owl-embedded .game-container {
  min-height: auto !important;
}
</style>
<script id="owl-theme-bridge-js">
(function () {
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var fromUrl = null;
  try { fromUrl = new URLSearchParams(window.location.search).get("theme"); } catch (e) {}
  var pinned = root.getAttribute("data-owl-theme") || fromUrl;
  if (pinned !== "light" && pinned !== "dark") pinned = null;
  function apply(theme) {
    var t = theme || pinned || (media && media.matches ? "dark" : "light");
    root.setAttribute("data-theme", t);
  }
  apply();
  if (media && media.addEventListener) media.addEventListener("change", function () { if (!pinned) apply(); });
  window.addEventListener("message", function (event) {
    var d = event.data;
    if (d && d.type === "owl:theme" && (d.theme === "light" || d.theme === "dark")) {
      pinned = d.theme;
      apply(d.theme);
    }
  });
  if (window.parent !== window) {
    root.classList.add("owl-embedded");
    var lastH = 0;
    function sendHeight() {
      if (!document.body) return;
      var h = Math.max(480, Math.ceil(document.body.getBoundingClientRect().height));
      if (Math.abs(h - lastH) > 2) {
        lastH = h;
        try { window.parent.postMessage({ type: "resize", height: h }, "*"); } catch (e) {}
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", sendHeight);
    else sendHeight();
    window.addEventListener("load", sendHeight);
    if (window.ResizeObserver) {
      var startObs = function () { if (document.body) new ResizeObserver(sendHeight).observe(document.body); };
      if (document.body) startObs(); else document.addEventListener("DOMContentLoaded", startObs);
    }
  }
})();
</script>
</head>
<body>
    <h1>⭕ Tic Tac Toe ❌</h1>
    <p class="subtitle">Classic strategy game</p>
    
    <div class="mode-toggle">
        <button class="mode-btn active" data-mode="ai">vs Computer</button>
        <button class="mode-btn" data-mode="2p">2 Players</button>
    </div>
    
    <div class="status" id="status">X's turn</div>
    
    <div class="board" id="board"></div>
    
    <div class="scores">
        <div class="score score-x">
            <div class="score-value" id="scoreX">0</div>
            <div class="score-label">X Wins</div>
        </div>
        <div class="score">
            <div class="score-value" id="scoreTie">0</div>
            <div class="score-label">Ties</div>
        </div>
        <div class="score score-o">
            <div class="score-value" id="scoreO">0</div>
            <div class="score-label">O Wins</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="newGame()">New Game</button>
        <button class="btn btn-secondary" onclick="resetScores()">Reset Scores</button>
    </div>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;
        let vsAI = true;
        let scores = { X: 0, O: 0, tie: 0 };
        
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];
        
        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }
        
        function makeMove(index) {
            if (!gameActive || board[index]) return;
            
            board[index] = currentPlayer;
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase(), 'taken');
            
            const winner = checkWinner();
            if (winner) {
                gameActive = false;
                if (winner === 'tie') {
                    document.getElementById('status').textContent = "It's a tie!";
                    scores.tie++;
                    document.getElementById('scoreTie').textContent = scores.tie;
                } else {
                    document.getElementById('status').textContent = `${winner} wins!`;
                    scores[winner]++;
                    document.getElementById(`score${winner}`).textContent = scores[winner];
                    highlightWin(winner);
                }
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('status').textContent = `${currentPlayer}'s turn`;
            
            if (vsAI && currentPlayer === 'O' && gameActive) {
                setTimeout(aiMove, 400);
            }
        }
        
        function aiMove() {
            // Try to win
            let move = findBestMove('O');
            // Block player
            if (move === -1) move = findBestMove('X');
            // Take center
            if (move === -1 && !board[4]) move = 4;
            // Take corner
            if (move === -1) {
                const corners = [0, 2, 6, 8].filter(i => !board[i]);
                if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
            }
            // Take any
            if (move === -1) {
                const empty = board.map((v, i) => v ? -1 : i).filter(i => i !== -1);
                if (empty.length) move = empty[Math.floor(Math.random() * empty.length)];
            }
            if (move !== -1) makeMove(move);
        }
        
        function findBestMove(player) {
            for (const pattern of winPatterns) {
                const values = pattern.map(i => board[i]);
                const playerCount = values.filter(v => v === player).length;
                const emptyCount = values.filter(v => v === '').length;
                if (playerCount === 2 && emptyCount === 1) {
                    return pattern.find(i => !board[i]);
                }
            }
            return -1;
        }
        
        function checkWinner() {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return board.every(cell => cell) ? 'tie' : null;
        }
        
        function highlightWin(winner) {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] === winner && board[b] === winner && board[c] === winner) {
                    pattern.forEach(i => {
                        document.querySelector(`[data-index="${i}"]`).classList.add('win');
                    });
                    break;
                }
            }
        }
        
        function newGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status').textContent = "X's turn";
            createBoard();
        }
        
        function resetScores() {
            scores = { X: 0, O: 0, tie: 0 };
            document.getElementById('scoreX').textContent = '0';
            document.getElementById('scoreO').textContent = '0';
            document.getElementById('scoreTie').textContent = '0';
            newGame();
        }
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                vsAI = btn.dataset.mode === 'ai';
                newGame();
            };
        });
        
        createBoard();
    </script>
</body>
</html>
