<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #a0aec0; font-size: 0.85rem; margin-bottom: 1rem; }
        .status {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 1rem 0;
            min-height: 2rem;
            color: #4ade80;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 8px;
            background: #16213e;
            padding: 12px;
            border-radius: 12px;
        }
        .cell {
            width: 90px;
            height: 90px;
            background: #0f3460;
            border: none;
            border-radius: 8px;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .cell:hover:not(.taken) { background: #1a4a7a; }
        .cell.x { color: #e94560; }
        .cell.o { color: #4ade80; }
        .cell.win { background: rgba(74, 222, 128, 0.3); }
        .scores {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
            padding: 1rem;
            background: #16213e;
            border-radius: 8px;
        }
        .score { text-align: center; }
        .score-value { font-size: 1.5rem; font-weight: bold; }
        .score-label { font-size: 0.75rem; color: #a0aec0; }
        .score-x .score-value { color: #e94560; }
        .score-o .score-value { color: #4ade80; }
        .controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }
        .btn-secondary { background: #16213e; }
        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .mode-btn {
            padding: 0.5rem 1rem;
            background: #16213e;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .mode-btn.active { border-color: #e94560; background: rgba(233, 69, 96, 0.2); }
    </style>
</head>
<body>
    <h1>⭕ Tic Tac Toe ❌</h1>
    <p class="subtitle">Classic strategy game</p>
    
    <div class="mode-toggle">
        <button class="mode-btn active" data-mode="ai">vs Computer</button>
        <button class="mode-btn" data-mode="2p">2 Players</button>
    </div>
    
    <div class="status" id="status">X's turn</div>
    
    <div class="board" id="board"></div>
    
    <div class="scores">
        <div class="score score-x">
            <div class="score-value" id="scoreX">0</div>
            <div class="score-label">X Wins</div>
        </div>
        <div class="score">
            <div class="score-value" id="scoreTie">0</div>
            <div class="score-label">Ties</div>
        </div>
        <div class="score score-o">
            <div class="score-value" id="scoreO">0</div>
            <div class="score-label">O Wins</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="newGame()">New Game</button>
        <button class="btn btn-secondary" onclick="resetScores()">Reset Scores</button>
    </div>

    <script>
        let board = Array(9).fill('');
        let currentPlayer = 'X';
        let gameActive = true;
        let vsAI = true;
        let scores = { X: 0, O: 0, tie: 0 };
        
        const winPatterns = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];
        
        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.onclick = () => makeMove(i);
                boardEl.appendChild(cell);
            }
        }
        
        function makeMove(index) {
            if (!gameActive || board[index]) return;
            
            board[index] = currentPlayer;
            const cell = document.querySelector(`[data-index="${index}"]`);
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase(), 'taken');
            
            const winner = checkWinner();
            if (winner) {
                gameActive = false;
                if (winner === 'tie') {
                    document.getElementById('status').textContent = "It's a tie!";
                    scores.tie++;
                    document.getElementById('scoreTie').textContent = scores.tie;
                } else {
                    document.getElementById('status').textContent = `${winner} wins!`;
                    scores[winner]++;
                    document.getElementById(`score${winner}`).textContent = scores[winner];
                    highlightWin(winner);
                }
                return;
            }
            
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            document.getElementById('status').textContent = `${currentPlayer}'s turn`;
            
            if (vsAI && currentPlayer === 'O' && gameActive) {
                setTimeout(aiMove, 400);
            }
        }
        
        function aiMove() {
            // Try to win
            let move = findBestMove('O');
            // Block player
            if (move === -1) move = findBestMove('X');
            // Take center
            if (move === -1 && !board[4]) move = 4;
            // Take corner
            if (move === -1) {
                const corners = [0, 2, 6, 8].filter(i => !board[i]);
                if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
            }
            // Take any
            if (move === -1) {
                const empty = board.map((v, i) => v ? -1 : i).filter(i => i !== -1);
                if (empty.length) move = empty[Math.floor(Math.random() * empty.length)];
            }
            if (move !== -1) makeMove(move);
        }
        
        function findBestMove(player) {
            for (const pattern of winPatterns) {
                const values = pattern.map(i => board[i]);
                const playerCount = values.filter(v => v === player).length;
                const emptyCount = values.filter(v => v === '').length;
                if (playerCount === 2 && emptyCount === 1) {
                    return pattern.find(i => !board[i]);
                }
            }
            return -1;
        }
        
        function checkWinner() {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return board.every(cell => cell) ? 'tie' : null;
        }
        
        function highlightWin(winner) {
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] === winner && board[b] === winner && board[c] === winner) {
                    pattern.forEach(i => {
                        document.querySelector(`[data-index="${i}"]`).classList.add('win');
                    });
                    break;
                }
            }
        }
        
        function newGame() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status').textContent = "X's turn";
            createBoard();
        }
        
        function resetScores() {
            scores = { X: 0, O: 0, tie: 0 };
            document.getElementById('scoreX').textContent = '0';
            document.getElementById('scoreO').textContent = '0';
            document.getElementById('scoreTie').textContent = '0';
            newGame();
        }
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                vsAI = btn.dataset.mode === 'ai';
                newGame();
            };
        });
        
        createBoard();
    </script>
</body>
</html>
