<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Four in a Row</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .mode-toggle {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .mode-btn {
            padding: 0.4rem 0.75rem;
            background: #16213e;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .mode-btn.active { border-color: #e94560; }
        .status {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 0.5rem 0;
            min-height: 2rem;
        }
        .board {
            background: #3b82f6;
            padding: 8px;
            border-radius: 8px;
        }
        .row {
            display: flex;
            gap: 6px;
        }
        .row:not(:last-child) { margin-bottom: 6px; }
        .cell {
            width: 40px;
            height: 40px;
            background: #1a1a2e;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cell.red { background: #e94560; }
        .cell.yellow { background: #fbbf24; }
        .cell.win { box-shadow: 0 0 10px white, 0 0 20px white; }
        .cell:hover:not(.red):not(.yellow) { background: #2d3748; }
        .scores {
            display: flex;
            gap: 2rem;
            margin: 1rem 0;
        }
        .score { text-align: center; }
        .score-value { font-size: 1.5rem; font-weight: bold; }
        .score-label { font-size: 0.75rem; color: #a0aec0; }
        .red-score .score-value { color: #e94560; }
        .yellow-score .score-value { color: #fbbf24; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }
        .turn-indicator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .turn-disc {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }
        .turn-disc.red { background: #e94560; }
        .turn-disc.yellow { background: #fbbf24; }
    </style>
<style id="owl-theme-bridge">
:root[data-theme="dark"] {
  --bg-primary: #0e1524;
  --bg-secondary: #162036;
  --bg-card: #1d2943;
  --text-primary: #ece8dc;
  --text-secondary: #9ba6bd;
  --border: #24304a;
  color-scheme: dark;
}
:root[data-theme="dark"] body {
  background: #0e1524 !important;
  color: #ece8dc !important;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e6;
  --bg-secondary: #fafbf6;
  --bg-card: #e3e6d8;
  --text-primary: #1e2420;
  --text-secondary: #5b635c;
  --border: #c9ccbd;
  color-scheme: light;
}
:root[data-theme="light"] body {
  background: #eef0e6 !important;
  color: #1e2420 !important;
}
:root[data-theme="light"] h1,
:root[data-theme="light"] .title {
  color: #4b5a25 !important;
}
:root[data-theme="light"] .subtitle,
:root[data-theme="light"] .stat-label,
:root[data-theme="light"] .instructions,
:root[data-theme="light"] .hint,
:root[data-theme="light"] .info,
:root[data-theme="light"] .label {
  color: #5b635c !important;
}
:root[data-theme="light"] .stat,
:root[data-theme="light"] .stats,
:root[data-theme="light"] .score-box,
:root[data-theme="light"] .panel,
:root[data-theme="light"] .card-panel,
:root[data-theme="light"] .info-box,
:root[data-theme="light"] .modal-content,
:root[data-theme="light"] .game-over,
:root[data-theme="light"] .overlay-content,
:root[data-theme="light"] .difficulty-btn,
:root[data-theme="light"] .mode-btn,
:root[data-theme="light"] .ctrl-btn,
:root[data-theme="light"] .key,
:root[data-theme="light"] .letter-btn,
:root[data-theme="light"] .num-btn,
:root[data-theme="light"] .choice-btn,
:root[data-theme="light"] .option-btn {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border-color: #c9ccbd !important;
}
:root[data-theme="light"] .board,
:root[data-theme="light"] .grid,
:root[data-theme="light"] .game-board {
  background: #e3e6d8 !important;
  border-color: #c9ccbd !important;
}
:root[data-theme="light"] input[type="text"],
:root[data-theme="light"] input[type="number"],
:root[data-theme="light"] textarea,
:root[data-theme="light"] select {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border-color: #1e2420 !important;
}
:root.owl-embedded body,
:root.owl-embedded .container,
:root.owl-embedded .game-container {
  min-height: auto !important;
}
</style>
<script id="owl-theme-bridge-js">
(function () {
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var fromUrl = null;
  try { fromUrl = new URLSearchParams(window.location.search).get("theme"); } catch (e) {}
  var pinned = root.getAttribute("data-owl-theme") || fromUrl;
  if (pinned !== "light" && pinned !== "dark") pinned = null;
  function apply(theme) {
    var t = theme || pinned || (media && media.matches ? "dark" : "light");
    root.setAttribute("data-theme", t);
  }
  apply();
  if (media && media.addEventListener) media.addEventListener("change", function () { if (!pinned) apply(); });
  window.addEventListener("message", function (event) {
    var d = event.data;
    if (d && d.type === "owl:theme" && (d.theme === "light" || d.theme === "dark")) {
      pinned = d.theme;
      apply(d.theme);
    }
  });
  if (window.parent !== window) {
    root.classList.add("owl-embedded");
    var lastH = 0;
    function sendHeight() {
      if (!document.body) return;
      var h = Math.max(480, Math.ceil(document.body.getBoundingClientRect().height));
      if (Math.abs(h - lastH) > 2) {
        lastH = h;
        try { window.parent.postMessage({ type: "resize", height: h }, "*"); } catch (e) {}
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", sendHeight);
    else sendHeight();
    window.addEventListener("load", sendHeight);
    if (window.ResizeObserver) {
      var startObs = function () { if (document.body) new ResizeObserver(sendHeight).observe(document.body); };
      if (document.body) startObs(); else document.addEventListener("DOMContentLoaded", startObs);
    }
  }
})();
</script>
</head>
<body>
    <h1>🔴 Four in a Row 🟡</h1>
    
    <div class="mode-toggle">
        <button class="mode-btn active" data-mode="ai">vs Computer</button>
        <button class="mode-btn" data-mode="2p">2 Players</button>
    </div>
    
    <div class="status">
        <div class="turn-indicator">
            <div class="turn-disc red" id="turnDisc"></div>
            <span id="statusText">Red's turn</span>
        </div>
    </div>
    
    <div class="board" id="board"></div>
    
    <div class="scores">
        <div class="score red-score">
            <div class="score-value" id="redScore">0</div>
            <div class="score-label">Red</div>
        </div>
        <div class="score">
            <div class="score-value" id="draws">0</div>
            <div class="score-label">Draws</div>
        </div>
        <div class="score yellow-score">
            <div class="score-value" id="yellowScore">0</div>
            <div class="score-label">Yellow</div>
        </div>
    </div>
    
    <button class="btn" onclick="newGame()">New Game</button>

    <script>
        const ROWS = 6, COLS = 7;
        let board = [];
        let currentPlayer = 'red';
        let gameActive = true;
        let vsAI = true;
        let scores = { red: 0, yellow: 0, draws: 0 };
        
        function createBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
            
            for (let r = 0; r < ROWS; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.col = c;
                    cell.onclick = () => dropPiece(c);
                    row.appendChild(cell);
                }
                boardEl.appendChild(row);
            }
        }
        
        function dropPiece(col) {
            if (!gameActive) return;
            
            // Find lowest empty row
            let row = -1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) {
                    row = r;
                    break;
                }
            }
            
            if (row === -1) return; // Column full
            
            board[row][col] = currentPlayer;
            const cell = document.querySelectorAll('.row')[row].children[col];
            cell.classList.add(currentPlayer);
            
            if (checkWin(row, col)) {
                gameActive = false;
                document.getElementById('statusText').textContent = 
                    `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)} wins!`;
                scores[currentPlayer]++;
                document.getElementById(`${currentPlayer}Score`).textContent = scores[currentPlayer];
                return;
            }
            
            if (board.every(row => row.every(cell => cell))) {
                gameActive = false;
                document.getElementById('statusText').textContent = "It's a draw!";
                scores.draws++;
                document.getElementById('draws').textContent = scores.draws;
                return;
            }
            
            currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
            updateTurnIndicator();
            
            if (vsAI && currentPlayer === 'yellow' && gameActive) {
                setTimeout(aiMove, 500);
            }
        }
        
        function checkWin(row, col) {
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            
            for (const [dr, dc] of directions) {
                let count = 1;
                const winCells = [[row, col]];
                
                // Check positive direction
                for (let i = 1; i < 4; i++) {
                    const r = row + dr * i, c = col + dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === currentPlayer) {
                        count++;
                        winCells.push([r, c]);
                    } else break;
                }
                
                // Check negative direction
                for (let i = 1; i < 4; i++) {
                    const r = row - dr * i, c = col - dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === currentPlayer) {
                        count++;
                        winCells.push([r, c]);
                    } else break;
                }
                
                if (count >= 4) {
                    winCells.forEach(([r, c]) => {
                        document.querySelectorAll('.row')[r].children[c].classList.add('win');
                    });
                    return true;
                }
            }
            return false;
        }
        
        function aiMove() {
            // Simple AI: Try to win, then block, then random
            const cols = [...Array(COLS).keys()].sort(() => Math.random() - 0.5);
            
            // Check for winning move
            for (const col of cols) {
                const row = getDropRow(col);
                if (row !== -1) {
                    board[row][col] = 'yellow';
                    if (checkWinSimulation(row, col, 'yellow')) {
                        board[row][col] = null;
                        dropPiece(col);
                        return;
                    }
                    board[row][col] = null;
                }
            }
            
            // Check for blocking move
            for (const col of cols) {
                const row = getDropRow(col);
                if (row !== -1) {
                    board[row][col] = 'red';
                    if (checkWinSimulation(row, col, 'red')) {
                        board[row][col] = null;
                        dropPiece(col);
                        return;
                    }
                    board[row][col] = null;
                }
            }
            
            // Prefer center columns
            const preferredCols = [3, 2, 4, 1, 5, 0, 6];
            for (const col of preferredCols) {
                if (getDropRow(col) !== -1) {
                    dropPiece(col);
                    return;
                }
            }
        }
        
        function getDropRow(col) {
            for (let r = ROWS - 1; r >= 0; r--) {
                if (!board[r][col]) return r;
            }
            return -1;
        }
        
        function checkWinSimulation(row, col, player) {
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for (const [dr, dc] of directions) {
                let count = 1;
                for (let i = 1; i < 4; i++) {
                    const r = row + dr * i, c = col + dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) count++;
                    else break;
                }
                for (let i = 1; i < 4; i++) {
                    const r = row - dr * i, c = col - dc * i;
                    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) count++;
                    else break;
                }
                if (count >= 4) return true;
            }
            return false;
        }
        
        function updateTurnIndicator() {
            document.getElementById('turnDisc').className = `turn-disc ${currentPlayer}`;
            document.getElementById('statusText').textContent = 
                `${currentPlayer.charAt(0).toUpperCase() + currentPlayer.slice(1)}'s turn`;
        }
        
        function newGame() {
            currentPlayer = 'red';
            gameActive = true;
            createBoard();
            updateTurnIndicator();
        }
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                vsAI = btn.dataset.mode === 'ai';
                newGame();
            };
        });
        
        createBoard();
    </script>
</body>
</html>
