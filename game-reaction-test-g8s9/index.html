<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Reaction Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #a0aec0; font-size: 0.85rem; margin-bottom: 1rem; }
        .stats {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .stat {
            background: #16213e;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 0.7rem; color: #a0aec0; }
        .game-box {
            width: 300px;
            height: 300px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }
        .game-box.waiting {
            background: #e94560;
        }
        .game-box.ready {
            background: #4ade80;
        }
        .game-box.result {
            background: #16213e;
        }
        .game-box.early {
            background: #f59e0b;
        }
        .box-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .box-text {
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
            padding: 0 1rem;
        }
        .box-time {
            font-size: 3rem;
            font-weight: bold;
            margin: 0.5rem 0;
        }
        .box-unit {
            font-size: 1rem;
            color: #a0aec0;
        }
        .history {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 300px;
        }
        .history-item {
            padding: 0.3rem 0.6rem;
            background: #16213e;
            border-radius: 4px;
            font-size: 0.8rem;
        }
        .history-item.fast { color: #4ade80; }
        .history-item.medium { color: #fbbf24; }
        .history-item.slow { color: #e94560; }
        .rating {
            font-size: 1rem;
            margin-top: 0.5rem;
        }
    </style>
<style id="owl-theme-bridge">
:root[data-theme="dark"] {
  --bg-primary: #0e1524;
  --bg-secondary: #162036;
  --bg-card: #1d2943;
  --accent: #f0a030;
  --text-primary: #ece8dc;
  --text-secondary: #9ba6bd;
  --border: #24304a;
  color-scheme: dark;
}
:root[data-theme="dark"] body {
  background: #0e1524 !important;
  color: #ece8dc !important;
}
:root[data-theme="dark"] h1,
:root[data-theme="dark"] .title,
:root[data-theme="dark"] .stat-value {
  color: #f0a030 !important;
}
:root[data-theme="dark"] .stat,
:root[data-theme="dark"] .score-box,
:root[data-theme="dark"] .panel,
:root[data-theme="dark"] .ctrl-btn {
  background: #162036 !important;
  border: 1.5px solid #24304a !important;
  color: #ece8dc !important;
}
:root[data-theme="dark"] .board,
:root[data-theme="dark"] .grid,
:root[data-theme="dark"] .game-board {
  background: #162036 !important;
  border-color: #24304a !important;
}
:root[data-theme="dark"] .cell:not([class*="cell-"]):not(.red):not(.yellow):not(.p1):not(.p2):not(.revealed):not(.mine):not(.flagged):not(.correct):not(.present):not(.absent):not(.selected):not(.highlighted):not(.fixed):not(.given):not(.conflict):not(.error):not(.x):not(.o) {
  background: #1d2943;
  color: #ece8dc;
}
:root[data-theme="dark"] .btn:not(.btn-secondary):not(.btn-red):not(.btn-blue):not(.btn-green):not(.btn-yellow) {
  background: #f0a030 !important;
  color: #0e1524 !important;
}
:root[data-theme="light"] {
  --bg-primary: #eef0e6;
  --bg-secondary: #fafbf6;
  --bg-card: #e3e6d8;
  --accent: #4b5a25;
  --text-primary: #1e2420;
  --text-secondary: #5b635c;
  --border: #c9ccbd;
  color-scheme: light;
}
:root[data-theme="light"] body {
  background: #eef0e6 !important;
  color: #1e2420 !important;
}
:root[data-theme="light"] h1,
:root[data-theme="light"] .title,
:root[data-theme="light"] .stat-value {
  color: #4b5a25 !important;
}
:root[data-theme="light"] .subtitle,
:root[data-theme="light"] .stat-label,
:root[data-theme="light"] .instructions,
:root[data-theme="light"] .hint,
:root[data-theme="light"] .info,
:root[data-theme="light"] .label {
  color: #5b635c !important;
}
:root[data-theme="light"] .stat,
:root[data-theme="light"] .score-box,
:root[data-theme="light"] .panel,
:root[data-theme="light"] .card-panel,
:root[data-theme="light"] .info-box,
:root[data-theme="light"] .modal-content,
:root[data-theme="light"] .game-over,
:root[data-theme="light"] .overlay-content,
:root[data-theme="light"] .difficulty-btn,
:root[data-theme="light"] .mode-btn,
:root[data-theme="light"] .ctrl-btn,
:root[data-theme="light"] .key,
:root[data-theme="light"] .letter-btn,
:root[data-theme="light"] .num-btn,
:root[data-theme="light"] .choice-btn,
:root[data-theme="light"] .option-btn {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border: 1.5px solid #c9ccbd !important;
}
:root[data-theme="light"] .board,
:root[data-theme="light"] .grid,
:root[data-theme="light"] .game-board {
  background: #e3e6d8 !important;
  border: 1.5px solid #c9ccbd !important;
}
:root[data-theme="light"] .cell:not([class*="cell-"]):not(.red):not(.yellow):not(.p1):not(.p2):not(.revealed):not(.mine):not(.flagged):not(.correct):not(.present):not(.absent):not(.selected):not(.highlighted):not(.fixed):not(.given):not(.conflict):not(.error):not(.x):not(.o) {
  background: #d4d8c8;
  color: #1e2420;
  border-color: #b8bca9;
}
:root[data-theme="light"] .btn:not(.btn-secondary):not(.btn-red):not(.btn-blue):not(.btn-green):not(.btn-yellow) {
  background: #4b5a25 !important;
  color: #fafbf6 !important;
}
:root[data-theme="light"] .btn-secondary {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border: 1.5px solid #1e2420 !important;
}
:root[data-theme="light"] input[type="text"],
:root[data-theme="light"] input[type="number"],
:root[data-theme="light"] textarea,
:root[data-theme="light"] select {
  background: #fafbf6 !important;
  color: #1e2420 !important;
  border-color: #1e2420 !important;
}
:root.owl-embedded body,
:root.owl-embedded .container,
:root.owl-embedded .game-container {
  min-height: auto !important;
}
</style>
<script id="owl-theme-bridge-js">
(function () {
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  var fromUrl = null;
  try { fromUrl = new URLSearchParams(window.location.search).get("theme"); } catch (e) {}
  var pinned = root.getAttribute("data-owl-theme") || fromUrl;
  if (pinned !== "light" && pinned !== "dark") pinned = null;
  function apply(theme) {
    var t = theme || pinned || (media && media.matches ? "dark" : "light");
    root.setAttribute("data-theme", t);
  }
  apply();
  if (media && media.addEventListener) media.addEventListener("change", function () { if (!pinned) apply(); });
  window.addEventListener("message", function (event) {
    var d = event.data;
    if (d && d.type === "owl:theme" && (d.theme === "light" || d.theme === "dark")) {
      pinned = d.theme;
      apply(d.theme);
    }
  });
  if (window.parent !== window) {
    root.classList.add("owl-embedded");
    var lastH = 0;
    function sendHeight() {
      if (!document.body) return;
      var h = Math.max(480, Math.ceil(document.body.getBoundingClientRect().height));
      if (Math.abs(h - lastH) > 2) {
        lastH = h;
        try { window.parent.postMessage({ type: "resize", height: h }, "*"); } catch (e) {}
      }
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", sendHeight);
    else sendHeight();
    window.addEventListener("load", sendHeight);
    if (window.ResizeObserver) {
      var startObs = function () { if (document.body) new ResizeObserver(sendHeight).observe(document.body); };
      if (document.body) startObs(); else document.addEventListener("DOMContentLoaded", startObs);
    }
  }
})();
</script>
</head>
<body>
    <h1>⚡ Reaction Test</h1>
    <p class="subtitle">Test your reflexes!</p>
    
    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="average">---</div>
            <div class="stat-label">Average</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="best">---</div>
            <div class="stat-label">Best</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="tries">0</div>
            <div class="stat-label">Tries</div>
        </div>
    </div>
    
    <div class="game-box waiting" id="gameBox" onclick="handleClick()">
        <div class="box-icon" id="boxIcon">🎯</div>
        <div class="box-text" id="boxText">Click to start</div>
    </div>
    
    <div class="rating" id="rating"></div>
    
    <div class="history" id="history"></div>

    <script>
    const _owlStore = (() => { const m = {}; return { getItem(k) { try { return window.localStorage.getItem(k); } catch { return Object.prototype.hasOwnProperty.call(m, k) ? m[k] : null; } }, setItem(k, v) { m[k] = String(v); try { window.localStorage.setItem(k, v); } catch {} } }; })();
        let state = 'idle'; // idle, waiting, ready, result, early
        let startTime = 0;
        let timeout = null;
        let results = [];
        let bestTime = parseInt(_owlStore.getItem('reaction-best') || '9999');
        
        if (bestTime < 9999) {
            document.getElementById('best').textContent = bestTime + 'ms';
        }
        
        function handleClick() {
            const box = document.getElementById('gameBox');
            const icon = document.getElementById('boxIcon');
            const text = document.getElementById('boxText');
            
            switch(state) {
                case 'idle':
                case 'result':
                case 'early':
                    // Start waiting
                    state = 'waiting';
                    box.className = 'game-box waiting';
                    icon.textContent = '⏳';
                    text.innerHTML = 'Wait for green...';
                    document.getElementById('rating').textContent = '';
                    
                    const delay = Math.random() * 4000 + 1000; // 1-5 seconds
                    timeout = setTimeout(() => {
                        state = 'ready';
                        startTime = Date.now();
                        box.className = 'game-box ready';
                        icon.textContent = '🟢';
                        text.innerHTML = 'CLICK NOW!';
                    }, delay);
                    break;
                    
                case 'waiting':
                    // Clicked too early
                    clearTimeout(timeout);
                    state = 'early';
                    box.className = 'game-box early';
                    icon.textContent = '❌';
                    text.innerHTML = 'Too early!<br>Click to try again';
                    break;
                    
                case 'ready':
                    // Record time
                    const reactionTime = Date.now() - startTime;
                    state = 'result';
                    results.push(reactionTime);
                    
                    box.className = 'game-box result';
                    icon.textContent = '⚡';
                    text.innerHTML = `<div class="box-time">${reactionTime}</div><div class="box-unit">milliseconds</div>Click to try again`;
                    
                    updateStats(reactionTime);
                    break;
            }
        }
        
        function updateStats(time) {
            // Update tries
            document.getElementById('tries').textContent = results.length;
            
            // Update average
            const avg = Math.round(results.reduce((a, b) => a + b, 0) / results.length);
            document.getElementById('average').textContent = avg + 'ms';
            
            // Update best
            if (time < bestTime) {
                bestTime = time;
                _owlStore.setItem('reaction-best', bestTime);
            }
            document.getElementById('best').textContent = bestTime + 'ms';
            
            // Rating
            let rating = '';
            if (time < 200) rating = '🏆 Incredible!';
            else if (time < 250) rating = '🌟 Excellent!';
            else if (time < 300) rating = '👍 Good!';
            else if (time < 400) rating = '😊 Average';
            else rating = '🐢 Keep practicing!';
            document.getElementById('rating').textContent = rating;
            
            // History
            const historyEl = document.getElementById('history');
            const item = document.createElement('span');
            item.className = 'history-item';
            if (time < 250) item.classList.add('fast');
            else if (time < 350) item.classList.add('medium');
            else item.classList.add('slow');
            item.textContent = time + 'ms';
            historyEl.appendChild(item);
            
            // Keep only last 10
            while (historyEl.children.length > 10) {
                historyEl.removeChild(historyEl.firstChild);
            }
        }
        
        // Prevent accidental double-clicks
        document.getElementById('gameBox').addEventListener('mousedown', e => e.preventDefault());
    </script>
</body>
</html>
