<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Memory Match - Survival Edition</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #e94560;
            --accent-green: #4ade80;
            --accent-yellow: #fbbf24;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
        }

        header {
            text-align: center;
            padding: 1rem 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin: 1rem 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--bg-secondary);
            border-radius: 12px;
            margin: 0 auto;
            width: min(400px, calc(100vw - 2rem));
            height: min(400px, calc(100vw - 2rem));
        }

        .card {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: transform 0.3s, background 0.3s;
            user-select: none;
            position: relative;
        }

        .card::before {
            content: '?';
            font-size: 1.5rem;
            color: var(--accent);
            font-weight: bold;
        }

        .card.flipped::before,
        .card.matched::before {
            display: none;
        }

        .card.flipped,
        .card.matched {
            background: var(--bg-primary);
            border: 2px solid var(--accent);
        }

        .card.matched {
            border-color: var(--accent-green);
            background: rgba(74, 222, 128, 0.1);
        }

        .card:active:not(.flipped):not(.matched) {
            transform: scale(0.95);
        }

        .card-icon {
            display: none;
        }

        .card.flipped .card-icon,
        .card.matched .card-icon {
            display: block;
        }

        .controls {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            justify-content: center;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 2px solid var(--border);
        }

        .difficulty-selector {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .diff-btn {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 2px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .diff-btn.active {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.2);
        }

        .win-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(26, 26, 46, 0.98);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 9999;
            padding: 2rem;
            text-align: center;
        }

        .win-screen.show {
            display: flex;
        }

        .win-content {
            background: #16213e;
            padding: 2rem;
            border-radius: 16px;
            border: 2px solid #4ade80;
            max-width: 320px;
            width: 90%;
        }

        .win-icon {
            font-size: 4rem;
            margin-bottom: 0.5rem;
        }

        .win-title {
            font-size: 1.75rem;
            color: #4ade80;
            margin-bottom: 1rem;
        }

        .win-stats {
            color: #a0aec0;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .best-score {
            color: #fbbf24;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .win-btn {
            background: #e94560;
            color: #ffffff;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .win-btn:active {
            transform: scale(0.95);
            background: #d63d56;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        @media (max-width: 400px) {
            .card {
                font-size: 1.5rem;
            }
            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Memory Match</h1>
            <p class="subtitle">Survival Edition - Match the emergency supplies!</p>
        </header>

        <div class="difficulty-selector">
            <button class="diff-btn active" data-size="4">Easy (4x4)</button>
            <button class="diff-btn" data-size="6">Hard (6x4)</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="pairs">0/8</div>
                <div class="stat-label">Pairs</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="timer">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="controls">
            <button class="btn" onclick="newGame()">New Game</button>
        </div>
    </div>

    <div class="win-screen" id="winScreen">
        <div class="win-content">
            <div class="win-icon">🎉</div>
            <h2 class="win-title">You Win!</h2>
            <p class="win-stats" id="winStats">Completed in 0 moves and 0:00</p>
            <p class="best-score" id="bestScore"></p>
            <button class="win-btn" onclick="newGame(); closeWin();">Play Again</button>
        </div>
    </div>

    <footer>
        <p>Memory Match - Offline Mini-Game | OfflineOwl</p>
    </footer>

    <script>
        // Survival-themed emoji pairs
        const survivalEmojis = [
            '💧', '🔦', '🏠', '🩹', '🔥', '🧭', '📻', '🥫',
            '⛺', '🗺️', '🔋', '🧯', '⚡', '🚰', '🧤', '🪓'
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let totalPairs = 8;
        let timerInterval = null;
        let startTime = null;
        let gameStarted = false;
        let gridSize = 4;

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function createBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            const numCards = gridSize === 4 ? 16 : 24;
            totalPairs = numCards / 2;
            
            if (gridSize === 6) {
                board.style.gridTemplateColumns = 'repeat(6, 1fr)';
                board.style.gridTemplateRows = 'repeat(4, 1fr)';
                board.style.width = 'min(480px, calc(100vw - 2rem))';
                board.style.height = 'min(320px, calc((100vw - 2rem) * 0.67))';
            } else {
                board.style.gridTemplateColumns = 'repeat(4, 1fr)';
                board.style.gridTemplateRows = 'repeat(4, 1fr)';
                board.style.width = 'min(400px, calc(100vw - 2rem))';
                board.style.height = 'min(400px, calc(100vw - 2rem))';
            }

            // Select random emojis for this game
            const selectedEmojis = shuffle(survivalEmojis).slice(0, totalPairs);
            cards = shuffle([...selectedEmojis, ...selectedEmojis]);

            cards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.innerHTML = `<span class="card-icon">${emoji}</span>`;
                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });

            document.getElementById('pairs').textContent = `0/${totalPairs}`;
        }

        function flipCard(card) {
            if (!gameStarted) {
                startTimer();
                gameStarted = true;
            }

            if (flippedCards.length >= 2) return;
            if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const match = card1.dataset.emoji === card2.dataset.emoji;

            if (match) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('pairs').textContent = `${matchedPairs}/${totalPairs}`;
                flippedCards = [];

                if (matchedPairs === totalPairs) {
                    gameWon();
                }
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                }, 800);
            }
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function getTimeString() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function gameWon() {
            stopTimer();
            const timeStr = getTimeString();
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            
            document.getElementById('winStats').textContent = `Completed in ${moves} moves and ${timeStr}`;
            
            // Save best score
            const key = `memory-best-${gridSize}`;
            const best = localStorage.getItem(key);
            const score = moves * 10 + elapsed; // Lower is better
            
            if (!best || score < parseInt(best)) {
                localStorage.setItem(key, score);
                localStorage.setItem(`${key}-moves`, moves);
                localStorage.setItem(`${key}-time`, timeStr);
                document.getElementById('bestScore').textContent = '🏆 New Best Score!';
            } else {
                const bestMoves = localStorage.getItem(`${key}-moves`);
                const bestTime = localStorage.getItem(`${key}-time`);
                document.getElementById('bestScore').textContent = `Best: ${bestMoves} moves in ${bestTime}`;
            }

            document.getElementById('winScreen').classList.add('show');
        }

        function closeWin() {
            document.getElementById('winScreen').classList.remove('show');
        }

        function newGame() {
            stopTimer();
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            gameStarted = false;
            
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '0:00';
            
            createBoard();
        }

        // Difficulty selector
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gridSize = parseInt(btn.dataset.size);
                newGame();
            });
        });

        // Initialize
        newGame();
    </script>
</body>
</html>
