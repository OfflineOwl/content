  <body>
    <canvas id="scene" aria-label="A campsite you can look around"></canvas>
    <div id="labels" aria-hidden="false"></div>

    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">OfflineOwl</p>
        <h1 class="display">Knot Camp</h1>
      </div>
      <div class="topbar-actions">
        <button id="home" class="icon-button" type="button" aria-label="Back to camp" title="Back to camp" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 21 14 3" /><path d="M20.5 21 10 3" /><path d="M15.5 21 12 15l-3.5 6" /><path d="M2 21h20" /></svg>
        </button>
        <button id="theme" class="icon-button" type="button" aria-label="Switch to night" title="Switch to night">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
        </button>
      </div>
    </header>

    <aside id="panel" class="panel">
      <section id="camp" class="card">
        <div class="card-head">
          <p class="eyebrow">Learn a knot</p>
          <p id="learned-count" class="count"></p>
        </div>
        <div class="progress" role="progressbar" aria-label="Knots learned" aria-valuemin="0">
          <span id="learned-bar"></span>
        </div>
        <ul id="knot-list" class="knot-list"></ul>
        <p class="hint">Drag to look around. Scroll or pinch to zoom.</p>
      </section>

      <section id="lesson" class="card" hidden>
        <div class="card-head">
          <p id="lesson-eyebrow" class="eyebrow"></p>
          <button id="close" class="text-button" type="button">All knots</button>
        </div>
        <ol id="steps" class="steps" aria-label="Steps"></ol>
        <h2 id="step-title" class="display step-title"></h2>
        <p id="step-text" class="step-text"></p>
        <ul id="tips" class="tips" hidden></ul>
        <div class="controls">
          <button id="back" class="icon-button" type="button" aria-label="Previous step" title="Previous step (←)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <button id="replay" class="icon-button" type="button" aria-label="Replay step" title="Replay step (R)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg>
          </button>
          <button id="next" class="primary-button" type="button">Start</button>
        </div>
      </section>
    </aside>

    <div id="no-webgl" class="no-webgl" hidden>
      <div class="card">
        <h2 class="display">3D isn't available</h2>
        <p>This device or browser can't draw the campsite. The Essential Knots &amp; Rope Skills guide in the library covers the same knots in text.</p>
      </div>
    </div>

  </body>
</html>
