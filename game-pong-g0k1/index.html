<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .score-board {
            display: flex;
            gap: 3rem;
            margin: 0.5rem 0;
            font-size: 2rem;
            font-weight: bold;
        }
        .score { text-align: center; }
        .score-label { font-size: 0.75rem; color: #a0aec0; font-weight: normal; }
        .player-score { color: #4ade80; }
        .ai-score { color: #e94560; }
        #gameCanvas {
            background: #0a0a15;
            border-radius: 8px;
        }
        .controls {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .ctrl-btn {
            width: 80px;
            height: 60px;
            background: #16213e;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .ctrl-btn:active { background: #4ade80; }
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .difficulty {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .diff-btn {
            padding: 0.4rem 0.75rem;
            background: #16213e;
            border: 2px solid transparent;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .diff-btn.active { border-color: #e94560; }
        .win-msg {
            font-size: 1.25rem;
            font-weight: bold;
            min-height: 1.5rem;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <h1>🏓 Pong</h1>
    
    <div class="difficulty">
        <button class="diff-btn active" data-speed="4">Easy</button>
        <button class="diff-btn" data-speed="6">Medium</button>
        <button class="diff-btn" data-speed="8">Hard</button>
    </div>
    
    <div class="score-board">
        <div class="score player-score">
            <div id="playerScore">0</div>
            <div class="score-label">You</div>
        </div>
        <div class="score ai-score">
            <div id="aiScore">0</div>
            <div class="score-label">CPU</div>
        </div>
    </div>
    
    <div class="win-msg" id="winMsg"></div>
    
    <canvas id="gameCanvas" width="350" height="500"></canvas>
    
    <div class="controls">
        <button class="ctrl-btn" id="leftBtn">◄</button>
        <button class="ctrl-btn" id="rightBtn">►</button>
    </div>
    
    <button class="btn" onclick="startGame()">New Game</button>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const PADDLE_WIDTH = 80, PADDLE_HEIGHT = 12;
        const BALL_SIZE = 10;
        const WIN_SCORE = 5;
        
        let playerX = canvas.width / 2 - PADDLE_WIDTH / 2;
        let aiX = canvas.width / 2 - PADDLE_WIDTH / 2;
        let ball = { x: 0, y: 0, dx: 0, dy: 0 };
        let playerScore = 0, aiScore = 0;
        let aiSpeed = 4;
        let gameRunning = false;
        let animationId = null;
        
        function resetBall(direction = 1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * 4;
            ball.dy = direction * 5;
        }
        
        function draw() {
            // Background
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Center line
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = '#2d3748';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Player paddle (bottom)
            ctx.fillStyle = '#4ade80';
            ctx.beginPath();
            ctx.roundRect(playerX, canvas.height - 30, PADDLE_WIDTH, PADDLE_HEIGHT, 4);
            ctx.fill();
            
            // AI paddle (top)
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.roundRect(aiX, 20, PADDLE_WIDTH, PADDLE_HEIGHT, 4);
            ctx.fill();
            
            // Ball
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_SIZE, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function update() {
            // Move ball
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Wall collision
            if (ball.x <= BALL_SIZE || ball.x >= canvas.width - BALL_SIZE) {
                ball.dx = -ball.dx;
            }
            
            // Player paddle collision
            if (ball.dy > 0 && ball.y >= canvas.height - 30 - BALL_SIZE) {
                if (ball.x >= playerX && ball.x <= playerX + PADDLE_WIDTH) {
                    ball.dy = -Math.abs(ball.dy) * 1.05;
                    ball.dx += (ball.x - (playerX + PADDLE_WIDTH / 2)) * 0.1;
                }
            }
            
            // AI paddle collision
            if (ball.dy < 0 && ball.y <= 32 + BALL_SIZE) {
                if (ball.x >= aiX && ball.x <= aiX + PADDLE_WIDTH) {
                    ball.dy = Math.abs(ball.dy) * 1.05;
                    ball.dx += (ball.x - (aiX + PADDLE_WIDTH / 2)) * 0.1;
                }
            }
            
            // AI movement
            const aiCenter = aiX + PADDLE_WIDTH / 2;
            if (ball.dy < 0) {
                if (aiCenter < ball.x - 10) aiX += aiSpeed;
                else if (aiCenter > ball.x + 10) aiX -= aiSpeed;
            }
            aiX = Math.max(0, Math.min(canvas.width - PADDLE_WIDTH, aiX));
            
            // Scoring
            if (ball.y < 0) {
                playerScore++;
                document.getElementById('playerScore').textContent = playerScore;
                if (playerScore >= WIN_SCORE) {
                    endGame('You Win! 🎉');
                } else {
                    resetBall(1);
                }
            } else if (ball.y > canvas.height) {
                aiScore++;
                document.getElementById('aiScore').textContent = aiScore;
                if (aiScore >= WIN_SCORE) {
                    endGame('CPU Wins!');
                } else {
                    resetBall(-1);
                }
            }
            
            // Limit ball speed
            ball.dx = Math.max(-10, Math.min(10, ball.dx));
            ball.dy = Math.max(-12, Math.min(12, ball.dy));
        }
        
        function gameLoop() {
            if (gameRunning) {
                update();
                draw();
                animationId = requestAnimationFrame(gameLoop);
            }
        }
        
        function startGame() {
            playerScore = 0;
            aiScore = 0;
            document.getElementById('playerScore').textContent = '0';
            document.getElementById('aiScore').textContent = '0';
            document.getElementById('winMsg').textContent = '';
            
            playerX = canvas.width / 2 - PADDLE_WIDTH / 2;
            aiX = canvas.width / 2 - PADDLE_WIDTH / 2;
            resetBall(Math.random() > 0.5 ? 1 : -1);
            
            gameRunning = true;
            gameLoop();
        }
        
        function endGame(msg) {
            gameRunning = false;
            document.getElementById('winMsg').textContent = msg;
        }
        
        // Controls
        let leftPressed = false, rightPressed = false;
        
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') leftPressed = true;
            if (e.key === 'ArrowRight') rightPressed = true;
        });
        document.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft') leftPressed = false;
            if (e.key === 'ArrowRight') rightPressed = false;
        });
        
        document.getElementById('leftBtn').addEventListener('touchstart', () => leftPressed = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => leftPressed = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => rightPressed = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => rightPressed = false);
        
        setInterval(() => {
            if (gameRunning) {
                if (leftPressed && playerX > 0) playerX -= 8;
                if (rightPressed && playerX < canvas.width - PADDLE_WIDTH) playerX += 8;
            }
        }, 16);
        
        // Touch drag
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            playerX = e.touches[0].clientX - rect.left - PADDLE_WIDTH / 2;
            playerX = Math.max(0, Math.min(canvas.width - PADDLE_WIDTH, playerX));
        }, { passive: false });
        
        // Difficulty
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                aiSpeed = parseInt(btn.dataset.speed);
            };
        });
        
        resetBall();
        draw();
    </script>
</body>
</html>
