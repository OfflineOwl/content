/* ---------- tokens ---------- */

:root {
  --background: #eef0e6;
  --foreground: #1e2420;
  --card: #fafbf6;
  --muted: #e3e6d8;
  --muted-foreground: #5b635c;
  --accent: #e1e6cf;
  --primary: #4b5a25;
  --primary-foreground: #fafbf6;
  --destructive: #b3261e;
  --destructive-foreground: #fafbf6;
  --warning: #946112;
  --success: #4b5a25;
  --info: #2b6390;
  --border: #c9ccbd;
  --border-strong: #1e2420;
  --eyebrow: #8a5a2b;
  --ring: var(--primary);

  --cat-survival: #4b5a25;
  --cat-medical: #b3261e;
  --cat-food-water: #2b6390;
  --cat-shelter: #8a5a2b;
  --cat-communication: #1f6f6a;
  --cat-entertainment: #7a4e8c;
  --cat-reference: #5b635c;

  --display: 'Archivo Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Atkinson Hyperlegible Next', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --r-card: 12px;
  --r-control: 10px;
  --r-tile: 8px;
  --r-chip: 6px;
  --tap: 44px;
  --pad: clamp(16px, 4vw, 24px);
  --gap: 12px;
  --measure: 720px;
  color-scheme: light;
}

:root[data-theme='dark'] {
  --background: #0e1524;
  --foreground: #ece8dc;
  --card: #162036;
  --muted: #1d2943;
  --muted-foreground: #9ba6bd;
  --accent: #24304a;
  --primary: #f0a030;
  --primary-foreground: #0e1524;
  --destructive: #ff7a6b;
  --destructive-foreground: #0e1524;
  --warning: #f0c05a;
  --success: #9cc26b;
  --info: #6fb7ff;
  --border: #24304a;
  --border-strong: #33415f;
  --eyebrow: #9ba6bd;

  --cat-survival: #9cc26b;
  --cat-medical: #ff7a6b;
  --cat-food-water: #6fb7ff;
  --cat-shelter: #d4a373;
  --cat-communication: #7fd6c2;
  --cat-entertainment: #d7a6e8;
  --cat-reference: #a9b4c8;
  color-scheme: dark;
}

/* ---------- base ---------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

.owl {
  container-type: inline-size;
  max-width: var(--measure);
  margin: 0 auto;
  padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right))
    max(calc(var(--pad) * 2), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
}

.owl p {
  margin: 0 0 12px;
}
.owl p:last-child {
  margin-bottom: 0;
}
.owl a {
  color: var(--info);
  text-underline-offset: 2px;
}
.owl strong {
  font-weight: 700;
}
.owl :focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}
.owl [hidden] {
  display: none !important;
}

.owl-display {
  font-family: var(--display);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  line-height: 1.05;
  margin: 0;
}
.owl-eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--eyebrow);
  margin: 0;
}
.owl-mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}
.owl-muted {
  color: var(--muted-foreground);
}

/* ---------- header ---------- */

.owl-header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  align-items: start;
  margin-bottom: 20px;
}
.owl-header .owl-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.owl-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--cat, var(--primary));
  flex: none;
}
.owl-title {
  font-size: clamp(30px, 7cqi, 40px);
}
.owl-lede {
  grid-column: 1 / -1;
  color: var(--muted-foreground);
  font-size: 17px;
  margin: 4px 0 0;
}

/* ---------- buttons ---------- */

.owl-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: var(--tap);
  padding: 8px 16px;
  border-radius: var(--r-control);
  border: 1.5px solid var(--border-strong);
  background: transparent;
  color: var(--foreground);
  font: 700 16px/1.2 var(--body);
  cursor: pointer;
  touch-action: manipulation;
}
.owl-btn:hover {
  background: var(--accent);
}
.owl-btn.is-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-foreground);
}
.owl-btn.is-primary:hover {
  filter: brightness(1.08);
}
.owl-btn.is-quiet {
  border-color: transparent;
  color: var(--muted-foreground);
  font-weight: 400;
}
.owl-btn.is-icon {
  width: var(--tap);
  padding: 0;
}
.owl-btn svg,
.owl-ico {
  width: 20px;
  height: 20px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.owl-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

/* ---------- section tabs ---------- */

.owl-tabs {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: 6px;
  margin: 0 calc(var(--pad) * -1) 20px;
  padding: 8px var(--pad);
  background: var(--background);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.owl-tabs::-webkit-scrollbar {
  display: none;
}
.owl-tab {
  appearance: none;
  flex: 1 0 auto;
  min-height: var(--tap);
  padding: 8px 14px;
  border: 1.5px solid transparent;
  border-radius: var(--r-control);
  background: transparent;
  color: var(--muted-foreground);
  font: 700 15px/1.2 var(--body);
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
}
.owl-tab:hover {
  color: var(--foreground);
  background: var(--accent);
}
.owl-tab[aria-selected='true'] {

  text-transform: uppercase;

}
.owl .owl-callout-title {

.tone-note {

}
.tone-warning,
.tone-critical {

}
.tone-caution,
.tone-urgent {

}
.tone-success,
.tone-ok {
  --tone: var(--success);
  --tone-fg: var(--card);
}
:root[data-theme='dark'] .owl-callout-head {
  color: var(--background);
}

/* ---------- lists, steps, tables, reference ---------- */

.owl-list {
  margin: 0;
  padding-left: 22px;
}
.owl-list li + li {
  margin-top: 6px;
}

.owl-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: owl-step;
}
.owl-steps > li {
  counter-increment: owl-step;
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: 4px 10px;
  padding: 10px 0;
  border-top: 1px solid var(--border);
}
.owl-steps > li:first-child {
  border-top: 0;
  padding-top: 0;
}
.owl-steps > li::before {
  content: counter(owl-step);

  color: var(--eyebrow);
  text-align: center;
}
.owl .owl-step-title {
  font-weight: 700;
  margin: 0 0 2px;
}

.owl-table-wrap {
  border: 1.5px solid var(--border-strong);
  border-radius: var(--r-card);
  background: var(--card);
  overflow: hidden;
}
.owl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
}
.owl-table th,
.owl-table td {
  text-align: left;
  vertical-align: top;
  padding: 10px 14px;
  border-top: 1px solid var(--border);
}
.owl-table thead th {
  border-top: 0;
  font: 600 12px/1.4 var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;

  background: var(--muted);
}

}

@container (max-width: 479px) {

  .owl-table td:not(:first-child)::before {
    content: attr(data-label) ': ';

    text-transform: uppercase;
    color: var(--muted-foreground);
  }
}

.owl-reference {

  padding: 14px 16px;

.owl-progress {

.owl-count {

  font-variant-numeric: tabular-nums;
  color: var(--muted-foreground);
  white-space: nowrap;
}

.owl-calc {

}

}

}
.owl-field-hint {

}
.owl .owl-field-group {

  border-top: 1px solid var(--border);
}
.owl .owl-field-group:first-child {

}

}

}

}
.owl-input {

.owl-input::-webkit-outer-spin-button,
.owl-input::-webkit-inner-spin-button {

}
.owl-unit {

  top: 50%;
  transform: translateY(-50%);

  color: var(--muted-foreground);
  pointer-events: none;
}
.owl-select {

  min-height: var(--tap);
  padding: 8px 12px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--r-control);
  background: var(--card);
  color: var(--foreground);
  font: 400 16px/1.2 var(--body);
}
.owl-segments {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 4px;
  padding: 4px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--r-control);
  background: var(--card);

}

  min-height: 36px;
  padding: 6px 8px;
  border: 0;
  border-radius: 7px;

  color: var(--muted-foreground);
  font: 700 15px/1.2 var(--body);

  touch-action: manipulation;
}

}
.owl-toggle {

  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  cursor: pointer;
}

.owl-results {

  gap: 10px;

  container-type: inline-size;
  min-width: 0;
}
.owl-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}
.owl-stat {
  padding: 12px 14px;
  border: 1.5px solid var(--tone, var(--border-strong));
  border-radius: var(--r-card);
  background: var(--card);
}
.owl-stat-value {
  font: 600 26px/1.1 var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--tone, var(--foreground));
  overflow-wrap: anywhere;
}
.owl-stat-unit {
  font: 400 14px/1 var(--mono);
  color: var(--muted-foreground);
  margin-left: 4px;
}
.owl-stat-label {
  font-size: 14px;
  color: var(--muted-foreground);
  margin-top: 4px;
}
.owl-stat-note {
  font-size: 13px;
  color: var(--muted-foreground);
  margin-top: 4px;
}

.owl-question {

  padding: 10px 14px;

  border: 1.5px solid var(--border-strong);

  background: var(--card);

  border-top: 1px solid var(--border);
  cursor: pointer;
}

  height: 26px;
  margin: 0;
  border: 1.5px solid var(--border-strong);

  background: var(--card);
  display: grid;
  place-content: center;
  cursor: pointer;
  flex: none;
}

.owl-toggle input::after {

  height: 7px;
  border: solid var(--primary-foreground);
  border-width: 0 0 2.5px 2.5px;

.owl-score {

<script>
// Make Water Safe: boil it, bleach it, or find other water, and the bleach dose for any container.
// Fields: .claude/skills/owl-app/references/app-api.md. Check: node kit/build.mjs --check make-water-safe
//
// The order of the questions is the logic. Official advisories come first: a do not drink or do
// not use advisory means chemicals or toxins that boiling won't touch, so it ends the tree at
// bottled water. Signs of fuel or chemicals come next for the same reason. Only then does the
// tool pick a way to kill germs, best first: boiling, then bleach, then whatever else is to hand.
//
// Facts come only from the sources listed at the bottom (fetched and read November 2026).
// Figures used: rolling boil 1 minute, 3 minutes above 5,000 feet; bleach 5% to 9%: 2 drops per
// quart or liter, 8 per gallon, 40 (1/2 teaspoon, 2 1/2 mL) per 5 gallons; 1% bleach five times
// that; double for cloudy, murky, colored or very cold water; wait at least 30 minutes; no chlorine
// smell means dose again and wait 15 more; iodine 2%: 5 drops per quart or liter, 10 if cloudy.
//
// Where the sources disagree: EPA says boil 3 minutes above 5,000 feet, CDC above 6,500. The tool
// uses 5,000, which satisfies both. EPA doses 8.25% bleach at 6 drops a gallon; CDC doses all
// 5% to 9% bleach at 8. The calculator follows CDC: one figure for any US household bleach, and
// the larger dose for strong bleach, which only makes the taste stronger.
//
// The calculator converts with the rates in CDC's own table: 80 drops to a teaspoon in every row,
// and 16 drops to a milliliter in the gallon rows (8 drops = 1/2 mL; 40 drops = 1/2 teaspoon =
// 2 1/2 mL). Its quart rows round the milliliters further (10 drops of 1% bleach is listed as
// 1/2 mL; the rate gives 0.6), so the tool matches CDC on drops and spoons everywhere and on mL
// everywhere but that row. Spoon amounts round up to the nearest 1/8 teaspoon, so rounding never
// under-doses.

var DROPS_PER_QUART = { std: 2, one: 10 } // CDC: per quart or liter, 5% to 9% and 1% bleach
var QUARTS = { gal: 4, qt: 1 } // CDC doses a liter the same as a quart, so they share an option
var DROPS_PER_ML = 16
var DROPS_PER_TSP = 80
var EIGHTHS = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞']

function bleachDrops(amount, unit, strength, doubled) {
  return Math.ceil(amount * QUARTS[unit] * DROPS_PER_QUART[strength] * (doubled ? 2 : 1) - 1e-9)
}

// Teaspoons the way CDC writes them: too small to measure, a little under 1/8, then eighths.
function spoon(drops) {
  var tsp = drops / DROPS_PER_TSP
  if (tsp < 1 / 16) return 'Too small to measure'
  if (tsp < 1 / 8) return 'A little under ⅛ tsp'
  var eighths = Math.ceil(tsp * 8 - 1e-9)
  var whole = Math.floor(eighths / 8)
  return (whole ? String(whole) : '') + EIGHTHS[eighths % 8] + ' tsp'
}

// Milliliters to one decimal under 1 mL (CDC: 0.1 mL a quart), to the half above it.
function milliliters(drops) {
  var ml = drops / DROPS_PER_ML
  if (ml < 1) return (Math.round(ml * 10) / 10).toFixed(1) + ' mL'
  var halves = Math.round(ml * 2) / 2
  return (halves % 1 ? halves.toFixed(1) : String(halves)) + ' mL'
}
